version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redislabs/redisinsight:2.0.0
    ports:
      - "8001:8001"
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      - REACT_APP_API_URL=http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis_data:
